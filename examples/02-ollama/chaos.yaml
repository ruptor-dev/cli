version: "1"

agent:
  name: ollama_agent
  entrypoint: python agent.py
  mode: persistent
  env:
    TOOL_BASE_URL: http://localhost:8080
    OLLAMA_MODEL: qwen2

proxy:
  port: 8080
  passthrough_url: http://localhost:9090
  request_timeout_s: 30

tests:
  - id: search_timeout
    tool: /search
    fault: tool_timeout
    delay_ms: 30000
    probability: 1.0

  - id: search_slow
    tool: /search
    fault: slow_response
    delay_ms: 4000
    probability: 1.0

  - id: search_5xx
    tool: /search
    fault: tool_error
    status_code: 500
    body: '{"error":"upstream"}'
    probability: 1.0

  - id: search_rate_limit
    tool: /search
    fault: rate_limit
    retry_after_s: 5
    probability: 1.0

evaluation:
  max_iterations: 8
  timeout_s: 60
  llm_judge: false

output:
  format: both
  path: ./reports/
